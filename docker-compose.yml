services:
  postgres:
    image: postgres:16-alpine
    container_name: rutasv-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback-only (A9): the database and object store are dev/ops tooling,
      # never public surface; the app reaches them through the compose network.
      - "127.0.0.1:5432:5432"
    # No initdb.d mount: EF migrations are the single schema source and the
    # `migrator` service applies them, then loads database/seed.sql.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO gated its official docker.io/minio/minio image behind docker login
    # (anonymous pulls are denied on CI runners and fresh local machines), so the
    # stack uses the anonymously pullable Bitnami mirror. Same server, envs and
    # ports; data lives at /bitnami/minio/data and the entrypoint serves the API
    # on 9000 and the console on 9001 by default.
    image: bitnamilegacy/minio:latest
    container_name: rutasv-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # Loopback-only (A9), same reasoning as postgres.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    environment:
      ARGOS_PACKAGE_INDEX: https://raw.githubusercontent.com/argosopentech/argospm-index/ff90de60728f7c1338ff6b75974e4c89b2442d22/
      LT_LOAD_ONLY: es,en
      LT_CHAR_LIMIT: "1200"
      LT_BATCH_LIMIT: "2"
    volumes:
      - libretranslate-data:/home/libretranslate/.local
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # One-shot migrator: applies `dotnet ef database update` (populates
  # __EFMigrationsHistory) and then loads the idempotent seed with psql.
  # NOTE for existing dev databases that were created by the retired init.sql
  # (no __EFMigrationsHistory): they must be reset once with
  # `docker compose down -v` (or the history stamped manually) so migrations
  # can take over the schema.
  migrator:
    build:
      context: ./Backend
      dockerfile: Migrator.Dockerfile
    image: i-guana-travel-sv-migrator:local
    container_name: rutasv-migrator
    restart: "no"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./database:/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: i-guana-travel-sv-backend:latest
    container_name: rutasv-backend
    # Docker Desktop's embedded resolver (127.0.0.11 -> host DNS) fails
    # intermittently for external hosts, which broke the Gmail API calls.
    # Query public resolvers directly from the container instead.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - Minio__BucketName=rutasv
      # A8: URL the SPA receives for stored images. Defaults to localhost for
      # dev; deployments set MINIO_PUBLIC_ENDPOINT to the real origin.
      - Minio__PublicEndpoint=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - Jwt__Key=${Jwt__Key}
      - Email__From=${EMAIL_FROM}
      - Email__VerificacionHabilitada=${EMAIL_VERIFICACION_HABILITADA:-true}
      - Email__GoogleClientId=${GOOGLE_OAUTH_CLIENT_ID:-}
      - Email__GoogleClientSecret=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - Email__GoogleRefreshToken=${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      - Email__GoogleRedirectUri=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:5000/oauth2callback}
      - Email__SitioUrl=${FRONTEND_BASE_URL:-http://localhost}
      - Translation__LibreTranslate__Enabled=${LIBRETRANSLATE_ENABLED:-true}
      - Translation__LibreTranslate__BaseUrl=http://libretranslate:5000
      - Translation__LibreTranslate__TimeoutSeconds=${LIBRETRANSLATE_TIMEOUT_SECONDS:-15}
    # Frontend waits on this (see frontend.depends_on), so transient startup
    # 502s from the nginx proxy disappear. The runtime image ships no curl/wget;
    # bash's /dev/tcp opens the socket and probes /health for a 200 instead.
    healthcheck:
      # YAML double-quoting: \\r\\n passes literal backslash sequences to bash's
      # printf, which turns them into real CRLF before sending the probe.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \" 200 \" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  pgadmin:
    image: dpage/pgadmin4
    container_name: rutasv-pgadmin
    environment:
      # A9: credentials from the environment (with dev fallbacks) instead of
      # hardcoded values.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      # Loopback-only (A9): pgAdmin is local tooling.
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: i-guana-travel-sv-frontend:latest
    container_name: rutasv-frontend
    ports:
      - "80:80"
    depends_on:
      # A9: only answer traffic once the API is actually healthy; avoids
      # transient 502s during backend startup.
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  miniodata:
  libretranslate-data:
