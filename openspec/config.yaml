# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: .NET 10 (SDK 10.0.400) ASP.NET Core Web API in Backend/IguanaSV.Api (net10.0);
    EF Core 10.0.11 + Npgsql.EntityFrameworkCore.PostgreSQL 10.0.0 (PostgreSQL), Minio 7.0.0,
    FluentValidation 11.11.0, BCrypt.Net-Next 4.0.3, Swashbuckle 10.2.3.
    Frontend: React 19.2 + Vite 8.2 + Tailwind CSS 4.3 + react-router-dom 7.18 + react-leaflet 5.
    Infra: docker-compose (postgres, migrator one-shot, minio, backend, frontend, pgadmin);
      EF migrations are the single schema source; database/seed.sql is idempotent reference data.
    CI: .github/workflows/pr-validation.yml (dotnet build, npm build, docker compose smoke test).
  Architecture: monorepo (Backend/, Frontend/, database/). Minimal hosting in
    Backend/IguanaSV.Api/Program.cs; Controllers + Services + Validators + DTOs; EF scaffold
    entities use singularized Spanish names (Publicacione, Anfitrione, Notificacione, Amenidade);
    DbContext IguanasDbContext; snake_case tables via ToTable. Entry points:
    Backend/IguanaSV.Api/Program.cs, Frontend/src/main.jsx -> Frontend/src/App.jsx.
  Testing: ZERO tests in the repo. No test runner installed (backend or frontend).
    CI skips dotnet test when no *Tests.csproj exists; docker compose smoke test is the only
    runtime check. strict_tdd is false: no workspace-level test command exists.
  Style: Spanish domain vocabulary in code and comments; CI pins .NET 10.x and Node 22.

strict_tdd: false  # no test runner present in any discovered project; no workspace-level test command

projects:
  - path: Backend
    stack: .NET 10 ASP.NET Core Web API + EF Core + Npgsql + MinIO + FluentValidation + BCrypt
    test_command: ""  # none: no *Tests.csproj exists; dotnet test is not viable
    build_command: dotnet build Backend/IguanaSV.Api/IguanaSV.Api.csproj -c Release
    notes: >-
      Backend/IguanaSV.Api.sln declares NO projects (CI restore/build of the .sln is vacuous).
      Hardening candidate: add the project to the solution or build the .csproj directly.
  - path: Frontend
    stack: React 19 + Vite 8 + Tailwind CSS 4 + react-router-dom 7 + react-leaflet 5
    test_command: ""  # none: package.json has no test script or runner
    build_command: npm run build --prefix Frontend

testing:
  strict_tdd: false
  reason: no test runner present in any in-scope project (audited: zero test files repo-wide)
  recommended_backend: xUnit + Microsoft.AspNetCore.Mvc.Testing (WebApplicationFactory) for integration tests; Testcontainers for PostgreSQL; coverlet for coverage
  recommended_frontend: Vitest + @testing-library/react + jsdom; Playwright for E2E
  dev_commands:
    - docker compose up            # full stack (repo root)
    - dotnet run --project Backend/IguanaSV.Api
    - npm run dev --prefix Frontend
  build_commands:
    - dotnet build Backend/IguanaSV.Api/IguanaSV.Api.csproj -c Release
    - npm run build --prefix Frontend

rules:
  proposal:
    - Include rollback plan for risky changes
    - Keep PRs under 400 changed lines; above that split into chained PRs or request size:exception
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Keep Spanish domain vocabulary consistent with EF scaffold naming
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: dotnet build Backend/IguanaSV.Api/IguanaSV.Api.csproj -c Release
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
