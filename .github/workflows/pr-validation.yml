name: Validación de PR

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend - build (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore IguanaSV.Api.sln

      - name: Compilar solución
        run: dotnet build IguanaSV.Api.sln -c Release --no-restore

      - name: Ejecutar pruebas (xUnit)
        # The solution always declares the test project, so an absent or
        # failing suite is a hard job failure (no skip branch). No filter:
        # every category runs (Guard, Schema, Authn, AuthZ, Reserva,
        # Overlap, Upload). The schema-drift guard (`has-pending-model-changes`
        # equivalent via Database.HasPendingModelChanges) is Category=Schema
        # and fails the build here when the model drifts from the migrations.
        run: dotnet test IguanaSV.Api.sln -c Release --no-build --verbosity normal

  frontend:
    name: Frontend - build (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Ejecutar pruebas unitarias (Vitest)
        # W7: the frontend suite is mandatory. Unit-tests the W3a service
        # layer (CSRF double-submit in api.js, /me rehydration gate in
        # session.js) under jsdom with a stubbed fetch. A missing or
        # failing suite fails the job.
        run: npm test

  docker:
    name: Integración - Docker Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Crear archivo .env de prueba
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=usuario_test
          POSTGRES_PASSWORD=pass_test_123
          POSTGRES_DB=rutasv_test
          MINIO_ROOT_USER=minio_test
          MINIO_ROOT_PASSWORD=minio_test_123
          Jwt__Key=ci-test-signing-key-0123456789abcdef0123456789abcdef
          EMAIL_FROM=IguanaSV CI Test <no-reply@example.com>
          EMAIL_VERIFICACION_HABILITADA=false
          EOF

      # Docker Hub rate-limits anonymous pulls from the shared GitHub Actions
      # runner IP pool; a pre-pull with backoff rides out the transient
      # "pull access denied / requested access denied" manifest lookups.
      - name: Pre-pull de imágenes externas (con reintento)
        run: |
          for image in postgres:16-alpine bitnamilegacy/minio:latest; do
            ok=0
            for attempt in 1 2 3 4 5; do
              echo "Pull $image intento $attempt..."
              docker pull "$image" && ok=1 && break
              sleep $((attempt * 10))
            done
            [ "$ok" = "1" ] || { echo "::error::Pull definitivo fallido para $image"; exit 1; }
          done

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar servicios (espera healthchecks)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test
        run: |
          echo "Verificando frontend (nginx)..."
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors \
            --silent --show-error --output /dev/null http://localhost/
          echo "Frontend OK"

          echo "Verificando backend (.NET API)..."
          # W7: assert a concrete success status (200) on the public read
          # endpoint instead of accepting any HTTP code. --retry-all-errors
          # retries non-2xx responses too, so a transient 5xx during startup
          # does not flake; the final code MUST be exactly 200.
          code=$(curl --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors \
            --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:5000/api/departamento)
          if [ "$code" != "200" ]; then
            echo "Backend smoke failed: HTTP $code (expected 200)" >&2
            exit 1
          fi
          echo "Backend OK (HTTP 200)"

      - name: Diagnóstico en caso de fallo
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=80

      - name: Apagar y limpiar servicios
        if: always()
        run: docker compose down -v --remove-orphans
